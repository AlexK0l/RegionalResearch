name: RegionalResearch offline regression checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preidentity-regression.yml'
  push:
    branches:
      - 'main'
      - 'audit/preidentity-review-20261009'
      - 'audit/qualification-a-hardening-20261012'
      - 'feature/evidence-first-cost-quality-20261028'
      - 'feature/saby-stage12-transport-windows-20261109'

jobs:
  verify:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel test runtime
        run: python -m pip install openpyxl==3.1.5
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: node --check src/pipeline.js
      - name: Offline regression
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            python -c 'import re,pathlib; s=pathlib.Path("test-output.log").read_text(encoding="utf8",errors="replace"); [print("::error title=Offline regression::"+s[m.start():m.start()+850].replace("%","%25").replace("\r","%0D").replace("\n","%0A")) for m in list(re.finditer(r"(?m)^not ok \\d+ - ",s))[:20]]'
            tail -n 80 test-output.log
          fi
          exit "$code"
