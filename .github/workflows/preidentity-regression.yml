name: RegionalResearch offline regression checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preidentity-regression.yml'
  push:
    branches:
      - 'main'
      - 'audit/preidentity-review-20261009'
      - 'audit/qualification-a-hardening-20261012'
      - 'feature/evidence-first-cost-quality-20261028'

jobs:
  verify:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax
        run: node --check src/pipeline.js
      - name: Offline regression
        run: npm test
