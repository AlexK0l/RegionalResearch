<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вход — RegionalResearch</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
  *{box-sizing:border-box}
  body{min-height:100vh;margin:0;background:#f3f6fb;color:#12253a;display:grid;place-items:center;padding:24px}
  main{width:min(100%,420px);background:white;border:1px solid #dce4f0;border-radius:16px;padding:32px;box-shadow:0 14px 34px rgba(12,36,66,.08)}
  h1{font-size:1.6rem;margin:0 0 12px}
  p{color:#50647b;line-height:1.5}
  label{display:block;font-weight:600;margin:24px 0 8px}
  input{width:100%;border:1px solid #aab8c9;padding:12px;border-radius:8px;font:inherit}
  button{width:100%;margin-top:18px;border:0;border-radius:8px;background:#174d84;color:white;padding:13px;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.65}
  #error{color:#a2192d;font-weight:600;min-height:1.5em}
</style>
</head>
<body>
<main>
  <h1>RegionalResearch</h1>
  <p>Войдите один раз. На этом устройстве вход сохранится на 30 дней, если браузер разрешает cookies.</p>
  <form id="login">
    <label for="password">Пароль доступа</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">Войти</button>
  </form>
  <p id="error" role="alert" aria-live="polite"></p>
</main>
<script>
const form=document.querySelector("#login");
const button=document.querySelector("#submit");
const error=document.querySelector("#error");
form.addEventListener("submit",async event=>{
  event.preventDefault();
  button.disabled=true;
  error.textContent="";
  try{
    const response=await fetch("/api/auth/login",{
      method:"POST",
      credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:document.querySelector("#password").value})
    });
    if(!response.ok){
      const result=await response.json().catch(()=>({}));
      throw new Error(result.error||"Ошибка входа");
    }
    document.querySelector("#password").value="";
    window.location.replace("/");
  }catch(err){
    error.textContent=err.message||"Ошибка входа";
    button.disabled=false;
  }
});
</script>
</body>
</html>
